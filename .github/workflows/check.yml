# 持续集成：把「本机能过」变成「换台机器也能过」。
#
# 这个项目没有构建步骤，所以检查很轻：自检 + 内核一致性 + 目录同步 + 勘察脚本自跑一遍。
# 全程只用 Node，几秒钟跑完。私有仓库的自动构建有额度，所以这里只放必要项。

name: check

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    # `edited` 不能漏：审查记录是往**提案正文**里填的，而改正文只会触发 `edited`。
    # 少了它，先开提案（红）、再补记录，这步检查不会重跑，状态停在上一次——
    # 反过来也一样：先填空话让它绿、之后再改正文，没有任何东西会复查。
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          # **必须取全历史**：下面「高风险改动必须有审查记录」那一步要算基线分支与本次
          # 的差异，而浅克隆里没有合并基点——`git diff A...B` 会失败或返回空。
          # 那种失败最坏的地方不是报错，是**静默通过**：空的改动清单等于「没动高风险路径」，
          # 门禁于是绿着放行，而它本该拦下的东西一件都没拦。
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # **跑完整的那趟，不加 `--no-behavior`。**
      #
      # 这个开关是给本地提速用的：它跳过行为自检，只验结构。CI 里省那两分钟换来的是
      # 一个真实的盲区——行为下限的比对只在完整那趟里做，跳过它就等于那条下限在 CI 里
      # 从未生效。实测过：下限写着 748、实测 736，完整自检恒红，而 CI 一路全绿。
      #
      # **不再单独跑一次 selftest**：完整 preflight 内部就会跑它（分片并行），并把
      # 摘要行、耗时与失败清单一起打出来。再跑一次是同一件事做两遍——实测让 CI 从
      # 约五分钟涨到十分钟以上，覆盖面一点没多。
      - name: 结构自检 + 行为自检（引用、内核、规范、用户包边界、断言下限）
        run: node scripts/dev/preflight.mjs

      - name: 内核与模板是否逐字一致
        run: node scripts/compose-agents.mjs . --check

      - name: README 的目录与标题是否同步
        run: node scripts/sync-toc.mjs README.md README.en.md --check

      # 上一条自检里的包边界看的是「按当前索引导出会得到什么」，这里看的是**真跑出来的
      # 那份包**：声明与实际是否一致，最终得由产出物自己回答。tar 只用来列条目，
      # 判定仍在自检里——同一份判据，两处不会给出两种答案。
      # `--at HEAD` 让文件地图也从同一个版本读：判据与对象同源，不靠「恰好一致」。
      - name: 用户包内容（真跑 git archive，与文件地图双向核对）
        run: |
          git archive --format=tar HEAD | tar -t > package-list.txt
          node scripts/dev/preflight.mjs --package package-list.txt --at HEAD

      # **只在提案上跑**：它判的是「这份提案的审查记录成不成立」，而推送事件里没有提案正文。
      # 判据本身与 CI 是两个维度：CI 绿说明现有检查都过了，它**不说明**这次改动有没有让
      # 检查本身变松——那是审查要回答的问题。
      #
      # 它核三件事：
      #   一、提案正文里有 `工作记录: <路径>` 指针，那份文件在本次改动里、且冻结了验收标准；
      #   二、每轮审查的 `fail` 引用的都是冻结清单里真有的 id（审查不能发明标准）；
      #   三、最后一轮 `fail` 为空、交了故障注入记录、且没有触发止损。
      #
      # **结论由脚本算，审查者不写。** 早先版本让审查者写一句结论、机器去读中文里
      # 「通过」是肯定还是否定——否定的写法列不完，每漏一种方向都是放行。
      - name: 高风险改动必须有审查记录（仅提案）
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # 取基线：全历史已经在手（上面 fetch-depth: 0），这里只需要那个分支的引用。
          git fetch --no-tags origin "$BASE_REF"
          # `diff.renames=false`：不带它时，一次改名只报**新路径**——把判定逻辑
          # `git mv` 到 `scripts/` 之外再改松，门禁会判成「不落在高风险路径」。
          # `core.quotepath=false`：默认配置会把中文文件名转义成 "\345\256\241..."，
          # 前缀判据匹配不上，中文名的风险改动会被判成非高风险、绿着放行。
          git -c core.quotepath=false -c diff.renames=false diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          printf '%s' "$PR_BODY" > pr-body.md

          # 把评论拉下来拼成一份文件。用平台 API 而不是 gh：gh 的 JSON 输出要再解析一层，
          # 而这里只需要「每条评论之间隔一行 ---COMMENT---」这个形状。
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            | node -e '
              let raw = ""
              process.stdin.on("data", (c) => { raw += c })
              process.stdin.on("end", () => {
                const list = JSON.parse(raw)
                if (!Array.isArray(list)) {
                  process.stderr.write("拉评论失败：" + raw.slice(0, 200) + "\n")
                  process.exit(3)
                }
                process.stdout.write(list.map((c) => c.body ?? "").join("\n---COMMENT---\n"))
              })
            ' > comments.txt

          # 豁免标签只豁免**止损**（同标准连续两轮、轮次超上限），不豁免「还有标准没过」。
          # 标签名来自契约的「## 协作参数」表；这里只判它在不在。
          WAIVED=""
          case ",$PR_LABELS," in
            *",pf:human-approved,"*) WAIVED="--waived" ;;
          esac

          # **`--expect-changes` 不能省**：提案不可能零改动，清单为空只说明 diff 没算出来。
          # 不带这个开关时，一次失败的 diff 会被读成「没动高风险路径」，门禁绿着放行。
          node scripts/review-record.mjs --expect-changes $WAIVED \
            --changed changed.txt --body pr-body.md --comments comments.txt
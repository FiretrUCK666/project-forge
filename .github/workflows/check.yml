# 持续集成：把「本机能过」变成「换台机器也能过」。
#
# 这个项目没有构建步骤，所以检查很轻：自检 + 内核一致性 + 目录同步 + 勘察脚本自跑一遍。
# 全程只用 Node，几秒钟跑完。私有仓库的自动构建有额度，所以这里只放必要项。

name: check

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 两步职责正交，不要合并：preflight 默认会**自己**跑一遍行为自检（分片并行，约一分钟），
      # 紧接着再单独跑一次 selftest 就是同一件事做两遍——实测 CI 从约 5 分钟涨到 10 分钟
      # 以上，覆盖率一点没多。所以这里显式加 --no-behavior，把行为那趟交给下一条。
      - name: 结构自检（引用、内核、规范、用户包边界）
        run: node scripts/dev/preflight.mjs --no-behavior

      - name: 行为自检（造 fixture 实跑，断言判定结果）
        run: node scripts/dev/selftest.mjs

      - name: 内核与模板是否逐字一致
        run: node scripts/compose-agents.mjs . --check

      - name: README 的目录与标题是否同步
        run: node scripts/sync-toc.mjs README.md README.en.md --check

      # 上一条自检里的包边界看的是「按当前索引导出会得到什么」，这里看的是**真跑出来的
      # 那份包**：声明与实际是否一致，最终得由产出物自己回答。tar 只用来列条目，
      # 判定仍在自检里——同一份判据，两处不会给出两种答案。
      # `--at HEAD` 让文件地图也从同一个版本读：判据与对象同源，不靠「恰好一致」。
      - name: 用户包内容（真跑 git archive，与文件地图双向核对）
        run: |
          git archive --format=tar HEAD | tar -t > package-list.txt
          node scripts/dev/preflight.mjs --package package-list.txt --at HEAD

      # **只在提案上跑**：它判的是「这份提案有没有审查记录」，而推送事件里没有提案正文。
      # 判据本身与 CI 是两个维度：CI 绿说明现有检查都过了，它**不说明**这次改动有没有让
      # 检查本身变松——那是审查要回答的问题。这一步把「我审过了」从自述变成可核对的痕迹。
      - name: 高风险改动必须有审查记录（仅提案）
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt || true
          printf '%s' "$PR_BODY" > pr-body.md
          node scripts/dev/review-record.mjs --changed changed.txt --body pr-body.md

# 发布说明自动写：推 v* 标签即建 GitHub Release，幂等，已存在则跳过。
# 正文由 scripts/draft-release-notes.mjs 从提交记录起草（中文人话 + 对比链接），
# 写进 UTF-8 文件再按字节发送——中文绝不经 shell 传递。
# 标签推得比本文件早、或某次失败时，用 workflow_dispatch 手动触发并填标签名补漏。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（例如 v0.4.1），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 建 Release 要写权限：gh 默认拿 GITHUB_TOKEN（只读），这里显式给写。
    # npm 可信发布的 id-token: write 与它是两回事（一个给制品库换短期令牌，
    # 一个给平台建 Release），不要以为写了一个另一个顺带有了。
    permissions:
      contents: write
    steps:
      - name: 检出标签（含全历史，起草要读上一个标签）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: 建 Release（不存在才建，已存在则跳过）
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          else
            node scripts/draft-release-notes.mjs "$TAG" notes.md
            gh release create "$TAG" --notes-file notes.md --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  <text x="312" y="262" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">dev-plan</text>
  <text x="312" y="287" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">3-tier doc plans</text>

  <rect x="540" y="234" width="228" height="66" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="558" y="262" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">dev-flow</text>
  <text x="558" y="287" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Worktree task flow</text>

  <!-- Row 2 of Skills -->
  <rect x="48" y="314" width="351" height="66" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="66" y="342" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">dev-review</text>
  <text x="66" y="367" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Evidence pack &amp; untrusted scan</text>

  <rect x="417" y="314" width="351" height="66" rx="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="435" y="342" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">dev-govern</text>
  <text x="576" y="341" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600">release-prep</text>
  <text x="435" y="367" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Drift audit &amp; release-prep check</text>

  <!-- Lower Right: Trust Inverted Pyramid -->

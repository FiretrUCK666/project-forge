<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="arch-en-title arch-en-desc">
  <title id="arch-en-title">Five Everyday Skills and Required Proof Before Merge</title>
  <desc id="arch-en-desc">Shows dev-explore, dev-plan, dev-flow, dev-review, and dev-govern on the left connected to a dark-ink merge gate panel listing four empirical verification checks on the right.</desc>
  <defs>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Stone paper outer card -->
  <rect x="1" y="1" width="1198" height="578" rx="18" fill="#F5F3EE" stroke="#DFDBD2" stroke-width="1.5"/>

  <!-- Left column: 5 everyday skill pills -->
  <g>
    <rect x="56" y="64" width="440" height="76" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="82" cy="92" r="5.5" fill="#4E7496"/>
    <text x="100" y="98" class="mono" font-size="17" font-weight="700" fill="#172033">dev-explore</text>
    <text x="100" y="124" class="sans" font-size="16" font-weight="400" fill="#526075">Map codebase and module boundaries first</text>

    <rect x="56" y="156" width="440" height="76" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="82" cy="184" r="5.5" fill="#4E7496"/>
    <text x="100" y="190" class="mono" font-size="17" font-weight="700" fill="#172033">dev-plan</text>
    <text x="100" y="216" class="sans" font-size="16" font-weight="400" fill="#526075">Align specs and numbered task checklists</text>

    <rect x="56" y="248" width="440" height="76" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="82" cy="276" r="5.5" fill="#D96B27"/>
    <text x="100" y="282" class="mono" font-size="17" font-weight="700" fill="#172033">dev-flow</text>
    <text x="100" y="308" class="sans" font-size="16" font-weight="400" fill="#526075">Deliver verified changes on a branch</text>

    <rect x="56" y="340" width="440" height="76" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="82" cy="368" r="5.5" fill="#1F6F5B"/>
    <text x="100" y="374" class="mono" font-size="17" font-weight="700" fill="#172033">dev-review</text>
    <text x="100" y="400" class="sans" font-size="16" font-weight="400" fill="#526075">Review diffs in an isolated context</text>

    <rect x="56" y="432" width="440" height="76" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="82" cy="460" r="5.5" fill="#1F6F5B"/>
    <text x="100" y="466" class="mono" font-size="17" font-weight="700" fill="#172033">dev-govern</text>
    <text x="100" y="492" class="sans" font-size="16" font-weight="400" fill="#526075">Audit test tiers and repository health</text>
  </g>

  <!-- Smooth cubic Bezier connectors -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M 496 102 C 548 102, 548 210, 598 210" stroke="#4E7496"/>
    <path d="M 496 194 C 546 194, 548 250, 598 250" stroke="#4E7496"/>
    <path d="M 496 286 C 544 286, 548 290, 598 290" stroke="#D96B27"/>
    <path d="M 496 378 C 546 378, 548 330, 598 330" stroke="#1F6F5B"/>
    <path d="M 496 470 C 548 470, 548 370, 598 370" stroke="#1F6F5B"/>
  </g>

  <!-- Right dark-ink merge proof panel -->
  <rect x="598" y="56" width="546" height="468" rx="18" fill="#172033"/>
  <circle cx="598" cy="210" r="5" fill="#4E7496"/>
  <circle cx="598" cy="250" r="5" fill="#4E7496"/>
  <circle cx="598" cy="290" r="5" fill="#D96B27"/>
  <circle cx="598" cy="330" r="5" fill="#1F6F5B"/>
  <circle cx="598" cy="370" r="5" fill="#1F6F5B"/>

  <text x="634" y="100" class="mono" font-size="16" font-weight="600" letter-spacing="1.8" fill="#8FA4FF">MERGE GATE · EVIDENCE</text>
  <text x="634" y="138" class="sans" font-size="24" font-weight="700" fill="#FFFFFF">Required Proof Before Merge</text>
  <line x1="634" y1="160" x2="1108" y2="160" stroke="#2B3750" stroke-width="1"/>

  <g>
    <rect x="634" y="186" width="68" height="30" rx="7" fill="none" stroke="#8FA4FF" stroke-width="1.5"/>
    <text x="668" y="207" class="mono" font-size="16" font-weight="700" fill="#8FA4FF" text-anchor="middle">SYNC</text>
    <text x="718" y="207" class="sans" font-size="18" font-weight="600" fill="#F8FAFC">Coupled contracts &amp; docs stay synced</text>
    <text x="718" y="233" class="mono" font-size="16" font-weight="400" fill="#94A3B8">AGENTS.md  ·  compose-agents --check</text>

    <rect x="634" y="266" width="68" height="30" rx="7" fill="none" stroke="#F2A65A" stroke-width="1.5"/>
    <text x="668" y="287" class="mono" font-size="16" font-weight="700" fill="#F2A65A" text-anchor="middle">DOCS</text>
    <text x="718" y="287" class="sans" font-size="18" font-weight="600" fill="#F8FAFC">Specs &amp; issues match branch state</text>
    <text x="718" y="313" class="mono" font-size="16" font-weight="400" fill="#94A3B8">docs/TDD.md · docs/{prd,specs,todo}</text>

    <rect x="634" y="346" width="68" height="30" rx="7" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="668" y="367" class="mono" font-size="16" font-weight="700" fill="#6EE7B7" text-anchor="middle">TEST</text>
    <text x="718" y="367" class="sans" font-size="18" font-weight="600" fill="#F8FAFC">Tiered fast checks &amp; real outputs</text>
    <text x="718" y="393" class="mono" font-size="16" font-weight="400" fill="#94A3B8">flow.mjs verify  ·  quick-test</text>

    <rect x="634" y="426" width="68" height="30" rx="7" fill="none" stroke="#FF8A7A" stroke-width="1.5"/>
    <text x="668" y="447" class="mono" font-size="16" font-weight="700" fill="#FF8A7A" text-anchor="middle">GATE</text>
    <text x="718" y="447" class="sans" font-size="18" font-weight="600" fill="#F8FAFC">Independent review, zero fake tests</text>
    <text x="718" y="473" class="mono" font-size="16" font-weight="400" fill="#94A3B8">review-pack.mjs  ·  govern-audit.mjs</text>
  </g>
</svg>

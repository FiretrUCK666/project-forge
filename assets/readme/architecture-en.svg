  <rect x="792" y="234" width="360" height="33" rx="6" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="972" y="259" text-anchor="middle" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">1. Static gates</text>

  <rect x="810" y="272" width="324" height="33" rx="6" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="972" y="297" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">2. Runtime smoke</text>

  <rect x="828" y="310" width="288" height="33" rx="6" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="972" y="335" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">3. Dual-gate review</text>

  <rect x="846" y="348" width="252" height="33" rx="6" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="972" y="373" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">4. Contract docs</text>
</svg>

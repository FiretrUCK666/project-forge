<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="arch-zh-title arch-zh-desc">
  <title id="arch-zh-title">五个日常技能协作流与合并前四项硬证明</title>
  <desc id="arch-zh-desc">上方按顺序展示 dev-explore 只读勘察、dev-plan 澄清写方案与独立内审、dev-flow 隔离实现与提审、dev-review 独立审查与合并收口（含退回原分支返工环线），下方左侧为 dev-govern 巡检复盘并向规划回流规则，右侧为合并前必须拿到的四项实证证据。</desc>
  <defs>
    <style>
      .sans { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#4E7496"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#D96B27"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#1F6F5B"/>
    </marker>
  </defs>

  <!-- Stone paper outer frame -->
  <rect x="1" y="1" width="1198" height="618" rx="18" fill="#F5F3EE" stroke="#DFDBD2" stroke-width="1.5"/>

  <!-- Title block -->
  <text x="48" y="48" class="mono" font-size="16" font-weight="600" letter-spacing="1.6" fill="#526075">FIVE SKILLS · STAGE FLOW</text>
  <text x="48" y="84" class="sans" font-size="26" font-weight="700" fill="#172033">五个技能按阶段分工推进，直到满足条件才合并</text>

  <!-- Forward arrows between stages 01 -> 02 -> 03 -> 04 -->
  <line x1="294" y1="204" x2="328" y2="204" stroke="#4E7496" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="580" y1="204" x2="614" y2="204" stroke="#4E7496" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="866" y1="204" x2="900" y2="204" stroke="#D96B27" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- Rework loop: 04 dev-review -> 03 dev-flow -->
  <path d="M 1029 286 L 1029 332 L 743 332 L 743 292" fill="none" stroke="#D96B27" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <rect x="752" y="314" width="268" height="34" rx="10" fill="#FFF7ED" stroke="#F2A65A" stroke-width="1.5"/>
  <text x="886" y="336" class="sans" font-size="16" font-weight="600" fill="#B45309" text-anchor="middle">打回原分支返工 · 达 3 轮停损转人</text>

  <!-- Govern feedback arrow: 05 dev-govern -> 02 dev-plan -->
  <path d="M 457 388 L 457 294" fill="none" stroke="#1F6F5B" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/>
  <rect x="336" y="324" width="242" height="32" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="457" y="346" class="sans" font-size="16" font-weight="600" fill="#1F6F5B" text-anchor="middle">提炼门禁补丁并更新规划尺度</text>

  <!-- Stage Cards 01 .. 04 -->
  <g id="stage-cards">
    <!-- 01 dev-explore -->
    <rect x="48" y="122" width="246" height="164" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="72" cy="150" r="6" fill="#4E7496"/>
    <text x="88" y="156" class="mono" font-size="16" font-weight="700" fill="#4E7496">01</text>
    <text x="88" y="188" class="mono" font-size="20" font-weight="700" fill="#172033">dev-explore</text>
    <text x="72" y="224" class="sans" font-size="18" font-weight="600" fill="#172033">只读勘察与定位</text>
    <text x="72" y="256" class="sans" font-size="16" font-weight="400" fill="#526075">查清入口、复用模块与命令</text>

    <!-- 02 dev-plan -->
    <rect x="334" y="122" width="246" height="164" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="358" cy="150" r="6" fill="#4E7496"/>
    <text x="374" y="156" class="mono" font-size="16" font-weight="700" fill="#4E7496">02</text>
    <text x="374" y="188" class="mono" font-size="20" font-weight="700" fill="#172033">dev-plan</text>
    <text x="358" y="224" class="sans" font-size="18" font-weight="600" fill="#172033">澄清需求与定标准</text>
    <text x="358" y="256" class="sans" font-size="16" font-weight="400" fill="#526075">PRD/SPEC/Todo · 独立内审</text>

    <!-- 03 dev-flow -->
    <rect x="620" y="122" width="246" height="164" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="644" cy="150" r="6" fill="#D96B27"/>
    <text x="660" y="156" class="mono" font-size="16" font-weight="700" fill="#D96B27">03</text>
    <text x="660" y="188" class="mono" font-size="20" font-weight="700" fill="#172033">dev-flow</text>
    <text x="644" y="224" class="sans" font-size="18" font-weight="600" fill="#172033">隔离开发与提审</text>
    <text x="644" y="256" class="sans" font-size="16" font-weight="400" fill="#526075">Worktree · 归档 · 绑定实证</text>

    <!-- 04 dev-review -->
    <rect x="906" y="122" width="246" height="164" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="930" cy="150" r="6" fill="#1F6F5B"/>
    <text x="946" y="156" class="mono" font-size="16" font-weight="700" fill="#1F6F5B">04</text>
    <text x="946" y="188" class="mono" font-size="20" font-weight="700" fill="#172033">dev-review</text>
    <text x="930" y="224" class="sans" font-size="18" font-weight="600" fill="#172033">独立双门审查</text>
    <text x="930" y="256" class="sans" font-size="16" font-weight="400" fill="#526075">双门 · 注入验证 · 过即合并</text>
  </g>

  <!-- Bottom Left: 05 dev-govern -->
  <g id="govern-card">
    <rect x="48" y="388" width="492" height="184" rx="16" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="76" cy="422" r="6.5" fill="#1F6F5B"/>
    <text x="94" y="428" class="mono" font-size="16" font-weight="700" fill="#1F6F5B">05 · CONTINUOUS GOVERNANCE</text>
    <text x="76" y="464" class="mono" font-size="22" font-weight="700" fill="#172033">dev-govern</text>
    <text x="230" y="464" class="sans" font-size="20" font-weight="600" fill="#172033">定期体检与复盘下沉</text>
    <text x="76" y="502" class="sans" font-size="16" font-weight="400" fill="#526075">· audit / reconcile：死链、死代码、测试分层与工作树清理</text>
    <text x="76" y="534" class="sans" font-size="16" font-weight="400" fill="#526075">· retro ← signals.jsonl：聚合同类返工与故障，产出规则补丁</text>
  </g>

  <!-- Bottom Right: Merge Gate Dark Card -->
  <g id="merge-gate-panel">
    <rect x="564" y="388" width="588" height="184" rx="16" fill="#172033"/>
    <text x="594" y="424" class="mono" font-size="16" font-weight="600" letter-spacing="1.4" fill="#8FA4FF">MERGE GATE · 由 dev-flow merge 与 dev-review 联合把关</text>
    <line x1="594" y1="440" x2="1122" y2="440" stroke="#2B3750" stroke-width="1"/>

    <!-- 2x2 Evidence Grid -->
    <rect x="594" y="458" width="60" height="28" rx="6" fill="none" stroke="#8FA4FF" stroke-width="1.5"/>
    <text x="624" y="478" class="mono" font-size="16" font-weight="700" fill="#8FA4FF" text-anchor="middle">SYNC</text>
    <text x="666" y="478" class="sans" font-size="17" font-weight="600" fill="#F8FAFC">契约与联动更新齐备</text>

    <rect x="844" y="458" width="60" height="28" rx="6" fill="none" stroke="#F2A65A" stroke-width="1.5"/>
    <text x="874" y="478" class="mono" font-size="16" font-weight="700" fill="#F2A65A" text-anchor="middle">DOCS</text>
    <text x="916" y="478" class="sans" font-size="17" font-weight="600" fill="#F8FAFC">标准全勾并成对归档</text>

    <rect x="594" y="512" width="60" height="28" rx="6" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="624" y="532" class="mono" font-size="16" font-weight="700" fill="#6EE7B7" text-anchor="middle">TEST</text>
    <text x="666" y="532" class="sans" font-size="17" font-weight="600" fill="#F8FAFC">分层实证匹配当前提交</text>

    <rect x="844" y="512" width="60" height="28" rx="6" fill="none" stroke="#FF8A7A" stroke-width="1.5"/>
    <text x="874" y="532" class="mono" font-size="16" font-weight="700" fill="#FF8A7A" text-anchor="middle">GATE</text>
    <text x="916" y="532" class="sans" font-size="17" font-weight="600" fill="#F8FAFC">独立审查过且无弱化</text>
  </g>
</svg>

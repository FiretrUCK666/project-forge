<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="ar-t ar-d">
  <title id="ar-t">八个日常研发技能的双工作树隔离与合并门禁</title>
  <desc id="ar-d">上方以双轨线路展示 main 主干、.worktrees/impl 与 .worktrees/review 隔离工作树及 Merge Gate，下方三栏列出验证工具、正向迭代与治理体检技能。</desc>
  <defs>
    <style>
      .sans { font-family: 'Inter', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Fira Code', Consolas, monospace; }
    </style>
    <marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#161614"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#C93B2B"/>
    </marker>
  </defs>
  <!-- Matte Archival Print Sheet (Zero Cards, Zero Drop Shadows, Zero Color Stripes) -->
  <rect x="0.75" y="0.75" width="1198.5" height="638.5" rx="4" fill="#F2EFE9" stroke="#CBC4B6" stroke-width="1.5"/>
  <!-- Swiss Editorial Running Folio -->
  <text x="48" y="40" class="mono" font-size="16" font-weight="600" letter-spacing="1.4" fill="#161614">03</text>
  <text x="92" y="40" class="mono" font-size="16" font-weight="500" letter-spacing="1.4" fill="#5E5A53">DAILY SKILLS</text>
  <text x="1152" y="40" class="mono" font-size="16" font-weight="500" letter-spacing="1.2" fill="#5E5A53" text-anchor="end">WORKTREE 隔离 · 八个技能</text>
  <line x1="48" y1="56" x2="1152" y2="56" stroke="#161614" stroke-width="1.2"/>

  <!-- main trunk rail -->
  <text x="48" y="128" class="mono" font-size="18" font-weight="700" fill="#161614">main</text>
  <line x1="116" y1="122" x2="1044" y2="122" stroke="#161614" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="116" cy="122" r="6" fill="#161614"/>
  <text x="1152" y="128" class="mono" font-size="18" font-weight="700" fill="#161614" text-anchor="end">merged</text>
  <circle cx="1056" cy="122" r="8" fill="#161614"/>
  <circle cx="1056" cy="122" r="3" fill="#FAF8F4"/>

  <!-- Branch switch down to twin rails -->
  <path d="M 164 122 L 164 252 L 950 252" fill="none" stroke="#161614" stroke-width="3.2" stroke-linejoin="round"/>
  <circle cx="164" cy="122" r="6.5" fill="#F2EFE9" stroke="#161614" stroke-width="3"/>

  <!-- Zone Labels and Isolation Boundary -->
  <text x="184" y="182" class="mono" font-size="16" font-weight="700" fill="#5E5A53">.worktrees/impl</text>
  <line x1="744" y1="164" x2="744" y2="338" stroke="#C93B2B" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="764" y="182" class="mono" font-size="16" font-weight="700" fill="#C93B2B">.worktrees/review</text>

  <!-- Five Circular Stations on Twin Rail -->
  <circle cx="212" cy="252" r="10" fill="#F2EFE9" stroke="#161614" stroke-width="3.8"/>
  <text x="212" y="224" class="mono" font-size="16" font-weight="700" fill="#8A8479" text-anchor="middle">01</text>
  <text x="212" y="294" class="mono" font-size="17" font-weight="700" fill="#161614" text-anchor="middle">dev-explore</text>
  <text x="212" y="322" class="sans" font-size="16" fill="#5E5A53" text-anchor="middle">只读定位探索</text>

  <circle cx="364" cy="252" r="10" fill="#F2EFE9" stroke="#161614" stroke-width="3.8"/>
  <text x="364" y="224" class="mono" font-size="16" font-weight="700" fill="#8A8479" text-anchor="middle">02</text>
  <text x="364" y="294" class="mono" font-size="17" font-weight="700" fill="#161614" text-anchor="middle">dev-plan</text>
  <text x="364" y="322" class="sans" font-size="16" fill="#5E5A53" text-anchor="middle">分档方案内审</text>

  <circle cx="508" cy="252" r="10" fill="#F2EFE9" stroke="#161614" stroke-width="3.8"/>
  <text x="508" y="224" class="mono" font-size="16" font-weight="700" fill="#8A8479" text-anchor="middle">03</text>
  <text x="508" y="294" class="mono" font-size="17" font-weight="700" fill="#161614" text-anchor="middle">dev-edit</text>
  <text x="508" y="322" class="sans" font-size="16" fill="#5E5A53" text-anchor="middle">改前核界静检</text>

  <circle cx="654" cy="252" r="10" fill="#F2EFE9" stroke="#161614" stroke-width="3.8"/>
  <text x="654" y="224" class="mono" font-size="16" font-weight="700" fill="#8A8479" text-anchor="middle">04</text>
  <text x="654" y="294" class="mono" font-size="17" font-weight="700" fill="#161614" text-anchor="middle">dev-flow</text>
  <text x="654" y="322" class="sans" font-size="16" fill="#5E5A53" text-anchor="middle">隔离流转提审</text>

  <circle cx="842" cy="252" r="12" fill="#F2EFE9" stroke="#C93B2B" stroke-width="4"/>
  <text x="842" y="224" class="mono" font-size="16" font-weight="700" fill="#C93B2B" text-anchor="middle">05</text>
  <text x="842" y="294" class="mono" font-size="17" font-weight="700" fill="#161614" text-anchor="middle">dev-review</text>
  <text x="842" y="322" class="sans" font-size="16" fill="#5E5A53" text-anchor="middle">独立复核注错</text>

  <!-- Rework Loop Arc -->
  <path d="M 842 338 L 842 384 Q 842 396 830 396 L 666 396 Q 654 396 654 384 L 654 342" fill="none" stroke="#C93B2B" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
  <text x="748" y="424" class="sans" font-size="17" font-weight="600" fill="#C93B2B" text-anchor="middle">不通过回原分支 · 最多 3 轮</text>

  <!-- Stark Editorial Solid Vermilion Square Stamp: MERGE GATE -->
  <rect x="964" y="176" width="188" height="176" rx="2" fill="#C93B2B"/>
  <rect x="974" y="186" width="168" height="156" fill="none" stroke="#F2EFE9" stroke-opacity="0.65" stroke-width="1.2"/>
  <text x="1058" y="232" class="sans" font-size="24" font-weight="700" fill="#FAF8F4" text-anchor="middle" letter-spacing="0.6">MERGE</text>
  <text x="1058" y="262" class="sans" font-size="24" font-weight="700" fill="#FAF8F4" text-anchor="middle" letter-spacing="0.6">GATE</text>
  <line x1="1008" y1="280" x2="1108" y2="280" stroke="#F2EFE9" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="1058" y="308" class="sans" font-size="17" font-weight="600" fill="#FAF8F4" text-anchor="middle">全绿合入</text>
  <text x="1058" y="332" class="mono" font-size="16" font-weight="500" fill="#F2EFE9" text-anchor="middle">禁止自审</text>
  <line x1="1056" y1="176" x2="1056" y2="138" stroke="#161614" stroke-width="3.2" marker-end="url(#a-ink)"/>

  <!-- LOWER SECTION: Swiss 3-Column Hairline Grid -->
  <line x1="48" y1="458" x2="1152" y2="458" stroke="#161614" stroke-width="1.4"/>
  <line x1="1058" y1="458" x2="1058" y2="360" stroke="#161614" stroke-width="2" marker-end="url(#a-ink)"/>
  <circle cx="1058" cy="458" r="4.5" fill="#161614"/>

  <line x1="416" y1="478" x2="416" y2="594" stroke="#CBC4B6" stroke-width="1.2"/>
  <line x1="784" y1="478" x2="784" y2="594" stroke="#CBC4B6" stroke-width="1.2"/>

  <text x="48" y="512" class="mono" font-size="28" font-weight="700" fill="#8A8479">06</text>
  <text x="104" y="512" class="mono" font-size="20" font-weight="700" fill="#161614">dev-verify-tools</text>
  <text x="104" y="556" class="sans" font-size="18" fill="#5E5A53">管理验证脚本与功能地图</text>

  <text x="440" y="512" class="mono" font-size="28" font-weight="700" fill="#8A8479">07</text>
  <text x="496" y="512" class="mono" font-size="20" font-weight="700" fill="#161614">dev-iterate</text>
  <text x="496" y="556" class="sans" font-size="18" fill="#5E5A53">补测试压盲区与复现循环</text>

  <text x="808" y="512" class="mono" font-size="28" font-weight="700" fill="#8A8479">08</text>
  <text x="864" y="512" class="mono" font-size="20" font-weight="700" fill="#161614">dev-govern</text>
  <text x="864" y="556" class="sans" font-size="18" fill="#5E5A53">体检清理与同类规则下沉</text>
</svg>

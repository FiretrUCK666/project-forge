<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="pfHeroTitle pfHeroDesc">
  <title id="pfHeroTitle">project-forge</title>
  <desc id="pfHeroDesc">A general project-governance skill: point it at a project directory, it surveys read-only first, then decides from facts what to do. On the right is real output from the survey script.</desc>

  <!--
    Neutral background on purpose: the host page may be light or dark, and a card that
    carries its own background stays readable on both. Margins are symmetric: 64 left and
    right, 56 top and bottom, 24 between blocks.
    Palette: background #E9E8E4, ink #17181A, muted #5D6064, rule #C6C4BF, accent #C2410C, panel #DFDED9.
  -->
  <rect width="1200" height="420" fill="#E9E8E4"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="58" width="6" height="20" fill="#C2410C"/>
    <text x="82" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">project governance skill</text>

    <text x="60" y="188" font-size="88" font-weight="700" letter-spacing="-2.5"
          fill="#17181A">project-forge</text>

    <text x="64" y="252" font-size="30" fill="#17181A">Point it at a project directory.</text>
    <text x="64" y="294" font-size="30" fill="#17181A">It surveys first, then decides.</text>

    <text x="64" y="352" font-size="19" fill="#5D6064">Version control · Docs · Remote · Releases</text>
    <text x="1136" y="352" font-size="18" text-anchor="end" fill="#5D6064"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Node &#8805; 16 · no dependencies</text>
  </g>

  <!-- Right: real output from the survey script (the P1 artifact, not an illustration) -->
  <g id="survey-proof">
    <rect x="676" y="112" width="460" height="214" fill="#DFDED9"/>

    <text x="704" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">$ node scripts/survey.mjs .</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
      <text x="704" y="196" fill="#5D6064">stack</text>
      <text x="790" y="196" fill="#17181A">node</text>

      <text x="704" y="234" fill="#5D6064">docs</text>
      <text x="790" y="234" fill="#17181A">AGENTS.md <tspan fill="#C2410C">missing</tspan></text>

      <text x="704" y="272" fill="#5D6064">release</text>
      <text x="790" y="272" fill="#17181A">nothing to publish</text>

      <text x="704" y="310" fill="#5D6064">remote</text>
      <text x="790" y="310" fill="#17181A">none</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="hero-zh-title hero-zh-desc">
  <title id="hero-zh-title">project-forge：把零散目录理顺为规范 GitHub 仓库的流程工具</title>
  <desc id="hero-zh-desc">展示 project-forge 从主干分支拉出配置分支，按只读勘察、融合文档契约、配齐 5 个日常技能、实证验证合入四步完成仓库整理并合回主干。</desc>
  <defs>
    <style>
      .sans { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Stone paper outer card (light & dark GitHub safe) -->
  <rect x="1" y="1" width="1198" height="498" rx="18" fill="#F5F3EE" stroke="#DFDBD2" stroke-width="1.5"/>

  <!-- Editorial title block -->
  <text x="64" y="68" class="mono" font-size="16" font-weight="600" letter-spacing="2" fill="#526075">GIT WORKFLOW HARNESS · GITHUB</text>
  <text x="64" y="130" class="sans" font-size="50" font-weight="700" fill="#172033" letter-spacing="-1">project-forge</text>
  <text x="64" y="172" class="sans" font-size="20" font-weight="400" fill="#526075">把零散目录理成有文档、有门禁、能自己迭代的 GitHub 仓库</text>

  <!-- Main baseline track -->
  <line x1="72" y1="364" x2="1128" y2="364" stroke="#B7B0A4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="72" y="396" class="mono" font-size="16" font-weight="600" fill="#526075">main</text>

  <!-- Setup branch cubic Bezier arc -->
  <path d="M 96 364 C 130 364, 132 276, 168 276 L 1036 276 C 1072 276, 1074 364, 1108 364" fill="none" stroke="#1F6F5B" stroke-width="3" stroke-linecap="round"/>

  <!-- Branch-off and merge anchors on main -->
  <circle cx="96" cy="364" r="6.5" fill="#F5F3EE" stroke="#4E7496" stroke-width="3"/>
  <circle cx="1108" cy="364" r="7" fill="#1F6F5B"/>

  <!-- Four workflow stage pills -->
  <g>
    <rect x="164" y="248" width="150" height="56" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="186" cy="276" r="5" fill="#4E7496"/>
    <text x="249" y="282" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">只读勘察</text>

    <rect x="352" y="248" width="188" height="56" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="374" cy="276" r="5" fill="#4E7496"/>
    <text x="456" y="282" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">融合文档契约</text>

    <rect x="578" y="248" width="236" height="56" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="600" cy="276" r="5" fill="#D96B27"/>
    <text x="706" y="282" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">配齐 5 个日常技能</text>

    <rect x="852" y="248" width="188" height="56" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="874" cy="276" r="5" fill="#1F6F5B"/>
    <text x="956" y="282" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">实证验证合入</text>
  </g>

  <!-- Repository artifacts cue -->
  <text x="600" y="446" class="mono" font-size="16" font-weight="500" fill="#526075" text-anchor="middle">AGENTS.md  ·  docs/{prd,spec,todo}  ·  .agents/skills/  ·  GitHub CI</text>
</svg>

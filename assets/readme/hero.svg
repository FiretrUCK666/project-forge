<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="512" viewBox="0 0 1200 512"
     role="img" aria-labelledby="pfHeroTitle pfHeroDesc">
  <title id="pfHeroTitle">project-forge</title>
  <desc id="pfHeroDesc">通用项目治理 skill：给一个项目目录，先只读勘察，再按事实决定做哪几件事。右侧是勘察结果节选：数值来自勘察脚本，行是卡片自己排的。</desc>

  <!--
    中性底色，不跟主题走：宿主页面可能是浅色也可能是深色，卡片自带底色才不会一半看不清。
    四张卡同一画布高 512。左右留白一律 64（render-svg.mjs 会量并判对称）；上下留白各 64，
    由内容排出来，不是撑出来的——改文案后重新量，别照抄数字。
    配色：底 #E9E8E4、正文 #17181A、次要 #5D6064、分隔 #C6C4BF、强调 #C2410C、面板 #DFDED9。
  -->
  <rect width="1200" height="512" fill="#E9E8E4"/>

  <!-- 左：这是什么 -->
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="64" width="6" height="24" fill="#C2410C"/>
    <text x="82" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">通用项目治理 skill</text>

    <text x="60" y="232" font-size="88" font-weight="700" letter-spacing="-2.5"
          fill="#17181A">project-forge</text>

    <text x="64" y="312" font-size="30" fill="#17181A">给它一个项目目录：先只读勘察，</text>
    <text x="64" y="356" font-size="30" fill="#17181A">再按事实决定做哪几件事。</text>

    <text x="64" y="440" font-size="19" fill="#5D6064">版本管理 · 文档套装 · 远端仓库 · 发布通道 · 交棒</text>
    <text x="1136" y="440" font-size="18" text-anchor="end" fill="#5D6064"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Node &#8805; 16 · 零依赖</text>
  </g>

  <!-- 右：勘察结果节选——数值来自勘察脚本，行是卡片自己排的（脚本本身不输出这个形状） -->
  <g id="survey-proof">
    <rect x="676" y="119" width="460" height="268" fill="#DFDED9"/>

    <text x="704" y="167" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">$ node scripts/survey.mjs .</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
      <text x="704" y="211" fill="#5D6064">生态</text>
      <text x="768" y="211" fill="#17181A">node</text>

      <text x="704" y="255" fill="#5D6064">文档</text>
      <text x="768" y="255" fill="#17181A">README <tspan fill="#C2410C">缺</tspan></text>

      <text x="704" y="299" fill="#5D6064">发布</text>
      <text x="768" y="299" fill="#17181A">未声明</text>

      <text x="704" y="343" fill="#5D6064">仓库</text>
      <text x="768" y="343" fill="#17181A">未初始化</text>
    </g>
  </g>
</svg>

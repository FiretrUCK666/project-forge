<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="502" viewBox="0 0 1200 502"
     role="img" aria-labelledby="pfInstallTitle pfInstallDesc">
  <title id="pfInstallTitle">两种装法</title>
  <desc id="pfInstallDesc">左边是从发布页下载压缩包：三步装好、不需要 git，装上之后自己保持最新；右边是克隆仓库，适合要改它或者要跟着每次改动走的人，但它不会自动更新。</desc>

  <!--
    两列同一套栅格：左右留白 64，两列各占一半，分栏线在正中 600。
    标题后面的「推荐」用 dx 紧跟标题，不写死坐标——写死的话中文一个值、英文另一个值，
    改一个字就得重新量一遍。
    纵向节奏：强调条 y74 起、标题基线 98、分栏线 128 起、列标题基线 188、
    三步步距 40、底块标题与第 3 步拉开 68（与步距 40 明显不同，两段才分得开）、
    底块说明再下 32。改文案后用 render-svg.mjs 的 bands 选项量一遍。
  -->
  <rect width="1200" height="502" fill="#E9E8E4"/>

  <g id="head" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="74" width="6" height="26" fill="#C2410C"/>
    <text x="84" y="98" font-size="40" font-weight="700" fill="#17181A">两种装法</text>
    <text x="1136" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">选一种就行</text>
  </g>

  <line x1="64" y1="128" x2="1136" y2="128" stroke="#C6C4BF" stroke-width="1"/>
  <line x1="600" y1="152" x2="600" y2="436" stroke="#C6C4BF" stroke-width="1"/>

  <g id="download" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="188" font-size="26" font-weight="700" fill="#17181A">下载压缩包<tspan dx="14"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17"
          font-weight="400" fill="#C2410C">推荐</tspan></text>

    <text x="64" y="238" font-size="19" fill="#5D6064">1　点发布页上那个安装包</text>
    <text x="64" y="278" font-size="19" fill="#5D6064">2　解压，放进你所用宿主的 skill 根</text>
    <text x="64" y="318" font-size="19" fill="#5D6064">3　把解压出的目录改名成 project-forge</text>

    <text x="64" y="386" font-size="20" font-weight="700" fill="#17181A">装上之后自己保持最新</text>
    <text x="64" y="418" font-size="18" fill="#5D6064">不需要 git，也不需要你管</text>
  </g>

  <g id="clone" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="640" y="188" font-size="26" font-weight="700" fill="#17181A">克隆仓库</text>

    <text x="640" y="238" font-size="19" fill="#5D6064">要改这个 skill 本身，或者想</text>
    <text x="640" y="278" font-size="19" fill="#5D6064">跟着每一次改动走时，用这条</text>

    <text x="640" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#17181A">git clone &lt;仓库地址&gt;</text>

    <text x="640" y="386" font-size="20" font-weight="700" fill="#17181A">它不会自动更新</text>
    <text x="640" y="418" font-size="18" fill="#5D6064">目录里有 .git 就是这种；更新请自己 git pull</text>
  </g>
</svg>

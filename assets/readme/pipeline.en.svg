<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="pfFlowTitle pfFlowDesc">
  <title id="pfFlowTitle">How it works</title>
  <desc id="pfFlowDesc">Four steps in a fixed order: survey read-only, decide from facts what to do and what to skip, pass the hard gates before writing, then write, push and release, reading back to confirm and asking whether to clear the traces afterwards. The input is surveyed facts, not a preset checklist.</desc>

  <!-- Same neutral background as the Chinese card: left and right margins are 64 everywhere;
       the top and bottom margins follow the content height (50 top, 56 bottom on this card).
       Re-measure after editing copy. -->
  <rect width="1200" height="440" fill="#E9E8E4"/>

  <g id="head" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="56" width="6" height="26" fill="#C2410C"/>
    <text x="84" y="80" font-size="40" font-weight="700" fill="#17181A">How it works</text>
    <text x="1136" y="78" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">four steps, in this order</text>
  </g>

  <line x1="64" y1="104" x2="1136" y2="104" stroke="#C6C4BF" stroke-width="1"/>

  <g id="steps" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">01</text>
    <text x="128" y="142" font-size="24" font-weight="700" fill="#17181A">Survey, read-only</text>
    <text x="128" y="170" font-size="19" fill="#5D6064">read the project&apos;s own manifests, layout and docs; write nothing</text>

    <text x="64" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">02</text>
    <text x="128" y="212" font-size="24" font-weight="700" fill="#17181A">Decide from facts</text>
    <text x="128" y="240" font-size="19" fill="#5D6064">what this directory needs and what to skip, stated in one sentence first</text>

    <text x="64" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">03</text>
    <text x="128" y="282" font-size="24" font-weight="700" fill="#17181A">Pass the hard gates</text>
    <text x="128" y="310" font-size="19" fill="#5D6064">read the matching criteria before writing docs, creating a repo, releasing</text>

    <text x="64" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">04</text>
    <text x="128" y="352" font-size="24" font-weight="700" fill="#17181A">Write · push · release</text>
    <text x="128" y="380" font-size="19" fill="#5D6064">read back to confirm; ask whether to clear the traces; then report what came out</text>
  </g>
</svg>

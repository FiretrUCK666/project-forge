<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="pfFlowTitle pfFlowDesc">
  <title id="pfFlowTitle">它怎么工作</title>
  <desc id="pfFlowDesc">三段流程：先只读勘察，读事实而不写文件；再按事实判定该做哪几件、跳过哪几件；最后落盘、推送、发布，并回读确认。判定依据是勘察出的全部事实，不是预设清单。</desc>

  <!-- 与 hero 同一套中性底色与留白：左右各 64，上下各 56 -->
  <rect width="1200" height="340" fill="#E9E8E4"/>

  <g id="head">
    <rect x="64" y="58" width="6" height="26" fill="#C2410C"/>
    <text x="84" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="40" font-weight="700" fill="#17181A">它怎么工作</text>
    <text x="1136" y="82" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">P0–P7 · 硬门控 G1–G8</text>
  </g>

  <line x1="64" y1="122" x2="1136" y2="122" stroke="#C6C4BF" stroke-width="1"/>

  <g id="stages" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="180" font-size="30" font-weight="700" fill="#17181A">只读勘察</text>
    <text x="64" y="210" font-size="19" fill="#5D6064">读事实，不写任何文件</text>

    <text x="452" y="180" font-size="30" font-weight="700" fill="#17181A">按事实判定</text>
    <text x="452" y="210" font-size="19" fill="#5D6064">该做哪几件，跳过哪几件</text>

    <text x="840" y="180" font-size="30" font-weight="700" fill="#17181A">落盘 · 推送 · 发布</text>
    <text x="840" y="210" font-size="19" fill="#5D6064">做完回读，确认真的成了</text>

    <g fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 174 L440 174 M430 166 L440 174 L430 182"/>
      <path d="M788 174 L828 174 M818 166 L828 174 L818 182"/>
    </g>
  </g>

  <line x1="64" y1="236" x2="1136" y2="236" stroke="#C6C4BF" stroke-width="1"/>

  <g id="foot" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="280" font-size="19" fill="#17181A">判定依据是勘察出的全部事实，不是预设清单。</text>
    <text x="1136" y="280" font-size="19" fill="#5D6064" text-anchor="end">每次写入之前，硬门控先拦一下</text>
  </g>
</svg>

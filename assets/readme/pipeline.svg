<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="522" viewBox="0 0 1200 522"
     role="img" aria-labelledby="pfFlowTitle pfFlowDesc">
  <title id="pfFlowTitle">它怎么工作</title>
  <desc id="pfFlowDesc">四步流程：先只读勘察、再按事实判定该做哪几件、写之前过硬门控、最后落盘推送发布并回读确认，跑完再问一句要不要把痕迹清掉。判定依据是勘察出的全部事实，不是预设清单。</desc>

  <!--
    三张分节卡共用一套纵向节奏：上留白 64、强调条 y74 起、标题基线 98、分隔线 y128、
    首个内容块基线 178、块内两行相距 28、块与块相距 80、下留白 64。
    改文案后用 render-svg.mjs 的 bands 选项量一遍：带间距不匀就是没排好。
  -->
  <rect width="1200" height="522" fill="#E9E8E4"/>

  <g id="head" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="74" width="6" height="26" fill="#C2410C"/>
    <text x="84" y="98" font-size="40" font-weight="700" fill="#17181A">它怎么工作</text>
    <text x="1136" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#5D6064">四步 · 顺序不能反</text>
  </g>

  <line x1="64" y1="128" x2="1136" y2="128" stroke="#C6C4BF" stroke-width="1"/>

  <g id="steps" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">01</text>
    <text x="128" y="178" font-size="24" font-weight="700" fill="#17181A">只读勘察</text>
    <text x="128" y="206" font-size="19" fill="#5D6064">读项目自己的清单、目录与已有文档，产出事实；不写任何文件</text>

    <text x="64" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">02</text>
    <text x="128" y="258" font-size="24" font-weight="700" fill="#17181A">按事实判定</text>
    <text x="128" y="286" font-size="19" fill="#5D6064">这份目录该做哪几件、跳过哪几件，先告诉你一句结论</text>

    <text x="64" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">03</text>
    <text x="128" y="338" font-size="24" font-weight="700" fill="#17181A">过硬门控</text>
    <text x="128" y="366" font-size="19" fill="#5D6064">写入、建仓库、发布、拆痕迹之前各读一份判据；跳过它等于凭猜做事</text>

    <text x="64" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#C2410C" font-weight="700">04</text>
    <text x="128" y="418" font-size="24" font-weight="700" fill="#17181A">落盘 · 推送 · 发布</text>
    <text x="128" y="446" font-size="19" fill="#5D6064">做完回读一遍，确认真的成了；收尾问一句要不要清掉痕迹，再按「做了什么 / 结果 / 下一步」汇报</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">project-forge 四步幂等工作流</title>
  <desc id="desc">三条接入路径（空目录 --bootstrap-empty、存量异构融合 artifactPlan、跨月漂移重入 reentry）汇入 S1 只读勘察、S2 逐项定界、S3 写前快照与按序落盘（版本库到文档到远端到自动化）、S4 实证体检与交棒四步幂等引擎。</desc>
  <defs>
    <pattern id="bp-grid-wf" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="340" rx="16" fill="#0B111E"/>
  <rect x="24" y="20" width="1152" height="300" rx="12" fill="url(#bp-grid-wf)" opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Section Header -->
  <text x="48" y="56" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700">四步幂等工作流</text>
  <text x="1152" y="55" text-anchor="end" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500">三条入口汇入同一条按序引擎，重复执行结果一致</text>
  <line x1="48" y1="72" x2="1152" y2="72" stroke="#1E293B" stroke-width="1.5"/>

  <!-- 3 Converging Entry Paths -->
  <rect x="48" y="88" width="348" height="58" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="222" y="114" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">空目录闭环起步</text>
  <text x="222" y="137" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">--bootstrap-empty</text>

  <rect x="426" y="88" width="348" height="58" rx="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="600" y="114" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">存量异构无损融合</text>
  <text x="600" y="137" text-anchor="middle" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">survey artifactPlan</text>

  <rect x="804" y="88" width="348" height="58" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="978" y="114" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600">跨月漂移重入校准</text>
  <text x="978" y="137" text-anchor="middle" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">reentry</text>

  <!-- Converging Collector Connectors into S1 -->
  <line x1="222" y1="146" x2="222" y2="164" stroke="#38BDF8" stroke-width="2"/>
  <line x1="600" y1="146" x2="600" y2="164" stroke="#F59E0B" stroke-width="2"/>
  <line x1="978" y1="146" x2="978" y2="164" stroke="#10B981" stroke-width="2"/>
  <line x1="222" y1="164" x2="978" y2="164" stroke="#475569" stroke-width="2"/>
  <line x1="146" y1="164" x2="222" y2="164" stroke="#38BDF8" stroke-width="2"/>
  <line x1="146" y1="164" x2="146" y2="180" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="146,186 139,175 153,175" fill="#38BDF8"/>

  <!-- 4-Step Idempotent Engine -->
  <!-- S1 -->
  <rect x="48" y="188" width="190" height="126" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="64" y="218" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">S1 只读勘察</text>
  <text x="64" y="254" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">survey.mjs</text>
  <text x="64" y="288" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">不写磁盘，判现状</text>

  <!-- Arrow S1 -> S2 -->
  <line x1="238" y1="251" x2="256" y2="251" stroke="#475569" stroke-width="2"/>
  <polygon points="262,251 252,245 252,257" fill="#475569"/>

  <!-- S2 -->
  <rect x="262" y="188" width="190" height="126" rx="12" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="278" y="218" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">S2 逐项定界</text>
  <text x="278" y="254" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">保留 / 补齐 / 跳过</text>
  <text x="278" y="288" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">人定取舍再落盘</text>

  <!-- Arrow S2 -> S3 -->
  <line x1="452" y1="251" x2="470" y2="251" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="476,251 466,245 466,257" fill="#F59E0B"/>

  <!-- S3 -->
  <rect x="476" y="188" width="380" height="126" rx="12" fill="#111827" stroke="#F59E0B" stroke-width="2"/>
  <text x="496" y="218" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">S3 写前快照与按序落盘</text>
  <text x="496" y="254" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">backup.mjs + equip + compose</text>
  <text x="496" y="288" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600">版本库 → 文档 → 远端 → 自动化</text>

  <!-- Arrow S3 -> S4 -->
  <line x1="856" y1="251" x2="874" y2="251" stroke="#10B981" stroke-width="2"/>
  <polygon points="880,251 870,245 870,257" fill="#10B981"/>

  <!-- S4 -->
  <rect x="880" y="188" width="272" height="126" rx="12" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="900" y="218" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">S4 实证体检与交棒</text>
  <text x="900" y="254" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">review &amp; handoff</text>
  <text x="900" y="288" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">可逆收尾，问人再清</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="wf-t wf-d">
  <title id="wf-t">三类起点汇入 S1-S4 治理流程轨道</title>
  <desc id="wf-d">以地铁线路图几何展示空目录起步、存量仓接入与跨代升级汇入 S1-S4 四步，上方标注写前 .zip 快照与失败整包回滚。</desc>
  <defs>
    <style>
      .sans { font-family: 'Inter', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Fira Code', Consolas, monospace; }
    </style>
    <marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#161614"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#C93B2B"/>
    </marker>
  </defs>
  <!-- Matte Archival Print Sheet (Zero Cards, Zero Drop Shadows, Zero Color Stripes) -->
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="4" fill="#F2EFE9" stroke="#CBC4B6" stroke-width="1.5"/>
  <!-- Swiss Editorial Running Folio -->
  <text x="48" y="40" class="mono" font-size="16" font-weight="600" letter-spacing="1.4" fill="#161614">02</text>
  <text x="92" y="40" class="mono" font-size="16" font-weight="500" letter-spacing="1.4" fill="#5E5A53">ONBOARDING · S1–S4</text>
  <text x="1152" y="40" class="mono" font-size="16" font-weight="500" letter-spacing="1.2" fill="#5E5A53" text-anchor="end">三类起点 · 四步流程</text>
  <line x1="48" y1="56" x2="1152" y2="56" stroke="#161614" stroke-width="1.2"/>

  <!-- Left Origin Branch Labels (Directly on Open Paper) -->
  <text x="172" y="138" class="sans" font-size="19" font-weight="600" fill="#161614" text-anchor="end">空目录起步</text>
  <text x="172" y="218" class="sans" font-size="19" font-weight="600" fill="#161614" text-anchor="end">存量仓接入</text>
  <text x="172" y="298" class="sans" font-size="19" font-weight="600" fill="#161614" text-anchor="end">跨代升级</text>

  <!-- Vignelli 45-Degree Transit Geometry -->
  <g fill="none" stroke="#161614" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 198 132 L 248 132 L 328 212"/>
    <path d="M 198 212 L 1096 212"/>
    <path d="M 198 292 L 248 292 L 328 212"/>
  </g>
  <circle cx="198" cy="132" r="7" fill="#F2EFE9" stroke="#161614" stroke-width="3.5"/>
  <circle cx="198" cy="212" r="7" fill="#F2EFE9" stroke="#161614" stroke-width="3.5"/>
  <circle cx="198" cy="292" r="7" fill="#F2EFE9" stroke="#161614" stroke-width="3.5"/>

  <!-- Overhead Vermilion Rollback Transit Loop -->
  <path d="M 852 198 L 852 132 Q 852 114 834 114 L 650 114 Q 632 114 632 132 L 632 190" fill="none" stroke="#C93B2B" stroke-width="2.6" stroke-dasharray="8 5" marker-end="url(#a-red)"/>
  <text x="742" y="100" class="sans" font-size="18" font-weight="600" fill="#C93B2B" text-anchor="middle">写前 .zip 快照 · 失败可整包回滚</text>

  <!-- Four Circular Metro Stations -->
  <circle cx="430" cy="212" r="12" fill="#F2EFE9" stroke="#161614" stroke-width="4.5"/>
  <text x="408" y="194" class="mono" font-size="17" font-weight="700" fill="#5E5A53" text-anchor="end">01</text>
  <text x="430" y="264" class="sans" font-size="22" font-weight="700" fill="#161614" text-anchor="middle">只读勘察</text>
  <text x="430" y="294" class="mono" font-size="16" fill="#5E5A53" text-anchor="middle">survey.mjs</text>

  <circle cx="632" cy="212" r="12" fill="#F2EFE9" stroke="#161614" stroke-width="4.5"/>
  <text x="610" y="194" class="mono" font-size="17" font-weight="700" fill="#5E5A53" text-anchor="end">02</text>
  <text x="632" y="264" class="sans" font-size="22" font-weight="700" fill="#161614" text-anchor="middle">确认范围</text>
  <text x="632" y="294" class="sans" font-size="17" fill="#5E5A53" text-anchor="middle">保留手写资产</text>

  <circle cx="852" cy="212" r="15" fill="#C93B2B"/>
  <circle cx="852" cy="212" r="6" fill="#FAF8F4"/>
  <text x="830" y="194" class="mono" font-size="17" font-weight="700" fill="#C93B2B" text-anchor="end">03</text>
  <text x="852" y="264" class="sans" font-size="22" font-weight="700" fill="#C93B2B" text-anchor="middle">备份后写入</text>
  <text x="852" y="294" class="mono" font-size="16" fill="#5E5A53" text-anchor="middle">equip · compose</text>

  <circle cx="1052" cy="212" r="12" fill="#161614"/>
  <circle cx="1052" cy="212" r="4.5" fill="#FAF8F4"/>
  <text x="1030" y="194" class="mono" font-size="17" font-weight="700" fill="#161614" text-anchor="end">04</text>
  <text x="1052" y="264" class="sans" font-size="22" font-weight="700" fill="#161614" text-anchor="middle">体检与交棒</text>
  <text x="1052" y="294" class="mono" font-size="16" fill="#5E5A53" text-anchor="middle">review · handoff</text>

  <line x1="1104" y1="196" x2="1104" y2="228" stroke="#161614" stroke-width="4.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="wf-zh-title wf-zh-desc">
  <title id="wf-zh-title">project-forge 接入流程：三类起点收敛到四步理顺</title>
  <desc id="wf-zh-desc">空目录起步、已有半套配置、多人维护项目三类起点，统一通过勘察现状、融合建骨架、配远端与门禁、体检交棒四步整理为可演进的规范仓库。</desc>
  <defs>
    <style>
      .sans { font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Stone paper outer card -->
  <rect x="1" y="1" width="1198" height="438" rx="18" fill="#F5F3EE" stroke="#DFDBD2" stroke-width="1.5"/>

  <!-- Header -->
  <text x="56" y="54" class="mono" font-size="16" font-weight="600" letter-spacing="1.8" fill="#526075">ONBOARDING · 按现状进场</text>
  <text x="56" y="92" class="sans" font-size="26" font-weight="700" fill="#172033">无论仓库处于哪种起点，都走这四步理顺</text>

  <!-- Convergence cubic Bezier curves -->
  <path d="M 280 171 C 324 171, 326 255, 364 255" fill="none" stroke="#4E7496" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 280 255 L 364 255" fill="none" stroke="#D96B27" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 280 339 C 324 339, 326 255, 364 255" fill="none" stroke="#1F6F5B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Horizontal pipeline spine -->
  <line x1="364" y1="255" x2="1008" y2="255" stroke="#B7B0A4" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="364" cy="255" r="5.5" fill="#F5F3EE" stroke="#172033" stroke-width="2.5"/>

  <!-- Left: 3 entry scenarios -->
  <g>
    <rect x="56" y="142" width="224" height="58" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="80" cy="171" r="5" fill="#4E7496"/>
    <text x="176" y="177" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">空目录起步</text>

    <rect x="56" y="226" width="224" height="58" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="80" cy="255" r="5" fill="#D96B27"/>
    <text x="176" y="261" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">已有半套配置</text>

    <rect x="56" y="310" width="224" height="58" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <circle cx="80" cy="339" r="5" fill="#1F6F5B"/>
    <text x="176" y="345" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">多人维护项目</text>
  </g>

  <!-- Right: 4 steps + final outcome -->
  <g>
    <rect x="392" y="214" width="126" height="82" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <text x="455" y="244" class="mono" font-size="16" font-weight="700" fill="#4E7496" text-anchor="middle">01</text>
    <text x="455" y="274" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">勘察现状</text>

    <rect x="538" y="214" width="136" height="82" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <text x="606" y="244" class="mono" font-size="16" font-weight="700" fill="#4E7496" text-anchor="middle">02</text>
    <text x="606" y="274" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">融合建骨架</text>

    <rect x="694" y="214" width="152" height="82" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <text x="770" y="244" class="mono" font-size="16" font-weight="700" fill="#D96B27" text-anchor="middle">03</text>
    <text x="770" y="274" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">配远端与门禁</text>

    <rect x="866" y="214" width="122" height="82" rx="14" fill="#FFFFFF" stroke="#DFDBD2" stroke-width="1.5"/>
    <text x="927" y="244" class="mono" font-size="16" font-weight="700" fill="#1F6F5B" text-anchor="middle">04</text>
    <text x="927" y="274" class="sans" font-size="18" font-weight="600" fill="#172033" text-anchor="middle">体检交棒</text>

    <rect x="1008" y="214" width="136" height="82" rx="14" fill="#1F6F5B"/>
    <text x="1076" y="248" class="sans" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">可演进的</text>
    <text x="1076" y="276" class="sans" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">规范仓库</text>
  </g>

  <!-- Safety reassurance footer -->
  <text x="392" y="352" class="mono" font-size="16" font-weight="500" fill="#526075">先只读盘点 · 按需分档装配 · 写前留仓外备份 · 手写与 CI 原样保留</text>
</svg>

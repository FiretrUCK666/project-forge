# project-forge CI 检查骨架

复制到 `.github/workflows/check.yml`，按 TODO 逐项替换后**删掉本注释块**。

**机制不要改，只换取值。** 落地前先看那个路径上有没有已存在的工作流：有就合并，
不要覆盖——里面可能有这个项目自己的门禁。

TODO(1) **运行环境**：按命中的生态只留一块（Node / Python / Rust / Go），
  版本取清单声明的那个；纯文档目录把整块删掉。落盘前核对所用 Action 的最新大版本
  （不要照抄这里的 vN）。
TODO(2) **门禁命令**：从 `AGENTS.md` 的「构建与验证」节逐条搬过来，一行一条。
  命令具体怎么写不重要，重要的是**与本地跑的是同一条**。
TODO(3) **产物一致性**：产物入库的项目（插件类、被安装的包）加最后一条——
  重新构建一次，与提交的产物逐字节一致，否则源码与产物迟早脱节。
TODO(4) **tags 行**：只在「打标签也值得跑一遍检查」时保留。

安全（配之前先读，配错就是把钥匙交给陌生人）：

  本文件用的是 `pull_request`，fork 来的提案会自动降成只读令牌、扣掉全部密钥——
  这是平台的安全网，不要为了「让检查跑起来」把它拆掉。

  **绝不要把这个触发器换成 `pull_request_target` 并去检出提案那边的代码**：
  那个触发器拿得到密钥，一旦它执行的又是提案里的代码，就等于让任意陌生人拿你的密钥
  跑他的代码（这类攻击叫 pwn request）。确实需要「有密钥的步骤」时，正确做法是拆成
  两个工作流：这个只读的跑检查并上传产物，另一个等它跑完之后只消费产物。

name: check

on:
  push:
    branches: ['**']
  pull_request:
    # `edited` 不能漏：有些项目的检查会读提案正文（比如要求填验收标准），
    # 而改正文只会触发这个事件。少了它，先开提案（红）、再补正文，检查不会重跑。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4  # 落盘前核对最新大版本

      # TODO(1)：按生态只留一块，其余整块删掉。
      - name: 准备运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '<清单声明的版本>'

      # TODO(2)：与 AGENTS.md 的构建与验证节逐条对应。
      - name: 门禁
        run: |
          <安装命令>
          <构建命令>
          <测试命令>

      # TODO(3)：产物入库的项目取消注释。
      # - name: 产物与提交一致
      #   run: |
      #     <重新构建命令>
      #     git diff --exit-code

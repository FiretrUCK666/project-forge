#     - uses: actions/setup-go@v5            # 落盘前核对最新大版本
#       with:
#         go-version-file: 'go.mod'
#
# 跨平台矩阵（项目在多个系统上表现不一样时才开，其余情况不要开——两倍等待换不到判据）：
#
#     strategy:
#       fail-fast: false
#       matrix:
#         os: [ubuntu-latest, windows-latest, macos-latest]
#     runs-on: ${{ matrix.os }}

name: check

on:
  push:
    branches: ['**']
  pull_request:
    # edited 不能漏：有些项目的检查会读提案正文（比如要求填验收标准），
    # 而改正文只会触发这个事件。少了它，先开提案（红）、再补正文，检查不会重跑。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 不能省：要算「相对分支基线的差异」时，浅克隆没有历史可比，
      # diff 会返回空清单——而空清单会被读成「这次没动高风险路径」，门禁绿着放行。
      # 那是一种静默失效：检查还在跑，只是它检查的东西一直是空的。
      - name: 检出（取全历史）
        uses: actions/checkout@v4  # 落盘前核对最新大版本
        with:
          fetch-depth: 0

      # TODO(1)：按生态只留一块，其余整块删掉。
      - name: 准备运行环境
        uses: actions/setup-node@v4
        with:
          node-version: '<清单声明的版本>'

      # TODO(2)：与 AGENTS.md 的构建与验证节逐条对应。
      - name: 门禁
        run: |
          <安装命令>
          <构建命令>
          <测试命令>

      # TODO(3)：产物入库的项目取消注释。
      # - name: 产物与提交一致
      #   run: |
      #     <重新构建命令>
      #     git diff --exit-code

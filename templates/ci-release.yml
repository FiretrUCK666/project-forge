# project-forge 发布自动化骨架：打标签即把**版本库里那份说明文件**贴到发布页上，
# 写完回读比对，不一致即失败。
#
# 用法：复制到项目的 .github/workflows/release.yml，按 TODO 逐项替换后删掉本注释块。
# 机制不要改，只换取值。落地前先看那个路径上有没有已存在的工作流：有就合并，
# 不要覆盖——里面可能有这个项目自己的发布链路。
#
# 前置（可以不做）：这套流程默认用平台内置令牌——只要下面 job 里的 permissions 声明了
#   contents: write，它就能建 Release，普通项目零配置即可发版。
#   只有两种情况才需要额外建一个 RELEASE_TOKEN（细粒度 token，仅 Contents 读写、仅本仓库）：
#     (1) 要让这次发版继续触发下游工作流——内置令牌触发的事件不会连锁触发别的流水线；
#     (2) 保护规则要求以特定身份操作。
#   要用时放进仓库 Settings → Secrets → Actions；有效期以创建页显示的上限为准，过期或换人
#   只换那一个值。token 一辈子只出现在两个框里（生成框 → Secrets 输入框），不进仓库、不进聊天。
#
# 这条流水线只做一件事：**把说明文件的内容原样搬到发布页**。它不生成说明、不改写说明，
# 所以「这一版更新了什么、修复了什么」这件事，在打标签之前就已经由人写好了——
# 写在哪、写成什么样，由项目自己的发版规范（仓库根 `RELEASING.md`）定义。
#
# TODO(1) 标签形状：按生态惯例只留一个——npm 一类 `v*`；Go 模块代理 `v*` 同形；
#   Obsidian 插件必须与 manifest.json 的 version 完全一致（裸版本，不带 v 前缀；
#   `v*` 推上去宿主认不出）。触发器写成什么样，job 级 `if:` 就要跟着写什么样。
#   **触发行与 job 级 `if:` 里的 `refs/tags/v` 必须同时改**：只改 `on.push.tags`
#   而把条件留着，裸版本标签永远进不来，job 一次都不会跑（模板里两处都标了 TODO(1)）。
#
# TODO(2) 说明文件的位置：把下面 env 里的 `<发布说明目录>` 换成项目自己的目录（发版规范里定义了它）。
#   **文件名必须与标签名逐字相同、扩展名 .md**：标签是 `vN.M.P` 就取 `vN.M.P.md`，
#   标签不带 `v` 前缀就照它的字面写。这条约定只定义在发版规范里，改路径时两处一起改。
#
# 为什么检出的是**默认分支**而不是标签：
#   说明文件是可补救的那个变量。标签是不可变的——读标签那棵树的话，忘记推说明就只有
#   「挪标签」（禁止，等于改别人的依据）或「发一个新补丁版本」两条路；读默认分支的话，
#   补推说明再手动触发一次就修好了。顺序要求一点没松：说明不在默认分支上，这一步直接红。
#
# 补漏：标签推得比说明早、或某次失败时，**先补推说明**，再用 workflow_dispatch 手动触发
#   并填标签名——不要重打标签。必须触发登记的同一个文件名（身份含文件名，调别的文件身份
#   不对），且该文件须在默认分支上（否则点触发没反应不是「坏了」）。
#   重跑会覆盖发布页上已有的正文；那一页被人工改写过时不要重跑。
#
# TODO(3) 门禁先行：本文件独立触发，默认不含门禁；要「检查全绿才许发布」时，
#   把检查 job 合并进同一文件再加 needs，而不要跨文件 needs
#   （needs 只能引用同一文件内的 job，跨文件在语法层即无效）。
#
# TODO(4) 制品库发布（npm / PyPI / crates.io 等）另起一个 job，按该制品库当前的可信发布
#   文档逐项接线。两条机制任何生态都成立：发布 job 声明短时身份签发权限（只给发布 job，
#   不给检查 job）；发布后回读一次「那一版真的在库上了」再收工——发布命令退出码为 0
#   不等于已经落地。
#
# Action 大版本：落盘前逐个核对当前大版本，并保持与 check.yml 同一大版本——
# 分头写会漂移，而漂移的那一处正是发版当天才暴露的那一处。

name: release

on:
  push:
    tags: ['v*']  # TODO(1) 改触发行时必须同改下面 job 级的 if: 条件
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 建 Release 要写权限。内置令牌的初始权限取仓库/组织的默认设置，受限默认下这里会 403；
    # 所以这个 job 显式声明 contents: write。凭据优先用 secrets.RELEASE_TOKEN，没配就退回
    # 内置令牌——两者都靠这一行权限。
    permissions:
      contents: write
    # 标签名只在这里求值一次：每个步骤引用同一个名字，不会算出两个不同的值。
    # 经 env 传入而不是直接展开进脚本正文——展开的话，输入框里的内容会被当成 shell 语法。
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      NOTES_DIR: '<发布说明目录>'  # TODO(2) 换成本项目的目录
    steps:
      - name: 检出默认分支（读说明文件；工具永远用最新那一版）
        uses: actions/checkout@v4  # 落盘前核对最新大版本
        with:
          # 取默认分支而不是触发时的 ref：说明文件必须能从默认分支读到（见文件头那段），
          # 而 workflow_dispatch 补漏时它还是你在界面上选的那个 ref。历史取全量，
          # 这样按标签读提交记录、按标签核版本号都还成立。
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 说明文件必须已经在默认分支上，而且不是空壳
        run: |
          # 这一步是整条流水线的门。它拦的正是最常见的那次失败：顺序反了，标签先推、
          # 说明没推。**不要把它删掉换成「找不到就用默认措辞」**——那样发布页上会出现
          # 一份没人写过的说明，而这次发版看起来还是绿的。
          NOTES="$NOTES_DIR/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::找不到 $NOTES。发版顺序反了：说明要先提交并推送到默认分支，再打标签。"
            exit 1
          fi
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES 是空文件。"
            exit 1
          fi
          # 结构门：**留着骨架标记或没有一级标题的说明发不出去**——一份只有小标题的空壳
          # 贴到发布页上，比这次发版失败糟。项目自己另有发送工具时，把那边的结构检查
          # 与这两条对齐（判据是同一条：正文真的写过了）。
          if grep -q 'pf:needs-summary' "$NOTES"; then
            echo "::error::$NOTES 还留着骨架标记（pf:needs-summary）：这一段还没写。"
            exit 1
          fi
          if ! grep -qE '^# +[^ ]' "$NOTES"; then
            echo "::error::$NOTES 缺一级标题：第一行应当是这一版的标签名。"
            exit 1
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: 写发布说明（建或更新，写完回读比对）
        env:
          # 优先用仓库 Secret 里的细粒度令牌，没配就退回平台内置令牌（见文件头「前置」）。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          # **是「建或更新」，不是「已存在就跳过」**：补漏重跑时必须回填正文，跳过会让
          # 那次发布永远只有一行标签名。代价是重跑会覆盖已有正文——发布页上有人工改写时
          # 不要重跑。
          #
          # --verify-tag 是护栏：标签名打错时它直接失败。没有它，创建命令会拿默认分支的
          # 状态自动建出一个同名新标签，而这次发版看起来还是绿的。
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file "$NOTES"
          fi

          # 回读比对。上一步返回 0 只说明命令自己认为成功了，不说明页面上的正文是什么样
          # ——编码层、代理、平台侧的规范化都可能改写它，而它们都不报错。只有把写进去的
          # 东西读回来比一次才作数。
          #
          # 比对前先归一：平台会规范化行尾与末尾空行，不归一的话一次纯格式差异就会被报成
          # 「正文被改写」——而它恰恰是这一步要抓的那类故障，报错本身不能有假警报。
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > readback.md
          # 归一：去行尾空白、去末尾空行。只做这两件，不动正文本身。
          norm() {
            awk '{ sub(/[ \t]+$/, "") } { line[NR] = $0 }
                 END { n = NR; while (n > 0 && line[n] == "") n -= 1
                       for (i = 1; i <= n; i += 1) print line[i] }' "$1"
          }
          norm "$NOTES" > want.txt
          norm readback.md > got.txt
          if ! diff -u want.txt got.txt; then
            echo "::error::回读的正文与说明文件不一致——正文在传输中被改写了。请打开页面确认实际内容，不要假定它是对的。"
            exit 1
          fi
          echo "回读一致：$TAG 的正文与 $NOTES 逐字相同。"

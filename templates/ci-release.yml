name: release

on:
  push:
    tags: ['v*']  # TODO(1) 改触发行时必须同改下面 job 级的 if: 条件
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签（含全历史，起草要读上一个标签）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: 建 Release（幂等，已存在则跳过）  # TODO(2)
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          else
            <起草命令，把正文写进 notes.md>
            gh release create "$TAG" --notes-file notes.md --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

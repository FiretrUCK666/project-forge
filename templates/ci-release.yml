# project-forge 发布自动化骨架：打标签即写发布说明，幂等，已存在则跳过。
#
# 用法：复制到目标项目的 .github/workflows/release.yml，按 TODO 逐项替换后删掉本注释块。
# 判据见 references/remote-github.md 第六节与 references/publish.md；机制不要改，只换取值。
#
# 前置（人做，自动化做不了）：仓库 Settings → Secrets → Actions 建 RELEASE_TOKEN——
#   细粒度 token，仅 Contents 读写、仅本仓库、90 天过期；过期或换人只换 Secrets 里那一个值。
#   token 一辈子只出现在两个框里（生成框 → Secrets 输入框），不进仓库、不进聊天。
#
# TODO(1) 标签形状：按生态惯例只留一个——npm 一类 `v*`；Go 模块代理 `v*` 同形；
#   Obsidian 插件必须与 manifest.json 的 version 完全一致（注意带不带 v，见专章）。
# TODO(2) 发布正文：--generate-notes 按提交记录自动生成（中文不经 shell，最稳）；
#   要手写正文时改用 scripts/release-notes.mjs 路径（UTF-8 文件按字节发送、回读比对）。
# TODO(3) 门禁先行：本文件独立触发，默认不含门禁；要“检查全绿才许发布”时，
#   把 templates/ci-check.yml 的 job 合并进同一文件再加 needs，而不要跨文件 needs。
# 补漏：标签推得比本文件早、或某次失败时，用 workflow_dispatch 手动触发并填标签名——不要重打标签。

name: release

on:
  push:
    tags: ['v*']  # TODO(1)
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      - name: 建 Release（幂等，已存在则跳过）  # TODO(2)
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

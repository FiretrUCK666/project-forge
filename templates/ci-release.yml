# project-forge 发布自动化骨架：打标签即写发布说明，幂等，已存在则跳过。
#
# 用法：复制到目标项目的 .github/workflows/release.yml，按 TODO 逐项替换后删掉本注释块。
# 判据见 references/remote-github.md 第六节与 references/publish.md；机制不要改，只换取值。
#
# 前置（人做，自动化做不了）：仓库 Settings → Secrets → Actions 建 RELEASE_TOKEN——
#   细粒度 token，仅 Contents 读写、仅本仓库、有效期以创建页显示的上限为准；
#   过期或换人只换 Secrets 里那一个值。
#   token 一辈子只出现在两个框里（生成框 → Secrets 输入框），不进仓库、不进聊天。
#
# TODO(1) 标签形状：按生态惯例只留一个——npm 一类 `v*`；Go 模块代理 `v*` 同形；
#   Obsidian 插件必须与 manifest.json 的 version 完全一致（裸版本，不带 v，
#   如 1.2.3；v* 推上去宿主认不出，见专章第七节）。review 会按触发器原文卡这一项。
#   **触发行与 job 级 `if:` 里的 `refs/tags/v` 必须同时改**：只改 `on.push.tags`
#   而把条件留着，裸版本标签永远进不来，job 一次都不会跑（模板里两处都标了 TODO(1)）。
# TODO(2) 发布正文（最终会显示在发布页面上，读者是使用者，不是你）：
#   正文必须回答两件事——**这一版更新了什么、修复了什么**，用使用者看得懂的话。
#   判据是「读者看不看得懂」：写「导出报表不再缺最后一页」，不写内部编号、任务代号、
#   分支名、提交哈希，也不写对使用者无影响的重构与测试数目。
#   **起草脚本必须收完整提交信息，不只是主题行**：主题行是一句话，而按提交纪律正文
#   才是给使用者的那大半。只取主题会让「不要照抄主题当正文」这条规矩**看着已经守住**
#   （人以为脚本代劳了），页面却仍然只有一行——收集不全和照抄主题，对读者是同一个结果。
#   机制：检出加 fetch-depth: 0，跑起草脚本把正文写成 UTF-8 文件，再 --notes-file 发送
#   （中文不经 shell）。起草脚本各项目自备一小段（Node 见本 skill 的 draft-release-notes.mjs，
#   纯脚本项目用同原理的 shell 版）；只要 --generate-notes 就仍是英文模板。
#   **起草结果只是素材，不是成品**：它把提交信息收集起来，而提交信息可能夹着代号与内部说法。
#   发版前由人把起草文件改写成面向使用者的说法（改哪个文件都行，改完仍是同一个发送路径）；
#   同一批改动跨多次提交时，这一步等于「补一段总述」，别省。
#   要完全手写正文时走 scripts/release-notes.mjs 路径（UTF-8 文件按字节发送、回读比对）。
# TODO(3) 门禁先行：本文件独立触发，默认不含门禁；要“检查全绿才许发布”时，
#   把 templates/ci-check.yml 的 job 合并进同一文件再加 needs，而不要跨文件 needs
#   （needs 只能引用同一文件内的 job，跨文件在语法层即无效；替代桥 workflow_run
#   引入竞态与复杂度，本模板不选它）。
# 补漏：标签推得比本文件早、或某次失败时，用 workflow_dispatch 手动触发并填标签名——不要重打标签。
#   必须触发登记的同一个文件名（身份含文件名，调别的文件身份不对），且该文件须在默认分支上
#   （否则点触发没反应不是“坏了”）。--verify-tag 是为此设的护栏：标签名打错时它直接失败；
#   没有它，创建命令会拿默认分支的状态自动建出一个同名新标签，而这次发版看起来还是绿的。
#
# 变体（分支驱动附件发布）：有的仓库推主干即发版、附件随包走（如插件模板的成品 tgz）。
#   那是另一套政策，不是本模板改个触发分支就能套用的：版本号来源、附件命名、同版重推
#   是否刷新、CI 与发布是否同文件，都要按该仓库文档重定。本模板只覆盖“标签驱动写发布说明”。
# 改写已有 Release 的正文，模板不做这件事——走 references/remote-github.md 6.1 的更新路径
#   （先按 tag 查出标识，再用标识去改，改完回读比对）。本模板只保证「同一份内容不重复创建」。
#
# Action 大版本：落盘前逐个核对当前大版本，并保持与 templates/ci-check.yml 同一大版本——
# 分头写会漂移，而漂移的那一处正是发版当天才暴露的那一处。
#
# TODO(4) npm 包才需要这一段（GitHub Release 上面已建好）。接线步骤照
#   `references/publish-npm.md` 的「可信发布接线步骤」逐项做——登记项（包名、仓库、
#   工作流文件名、environment 名）要在制品库网站上与本仓库逐字一致，漏一项到发布那一刻才报无权。
#   本文件只固定「有哪些节」，少一节就是漏一步：
#   - 发布 job 声明 id-token: write（短时身份换令牌用），它与建 Release 的 contents: write 是两回事；
#   - 发布 job 关掉包管理器缓存：旧缓存会改变发出去的东西；
#   - 发布前先跑门禁，不许发布没验过的树；
#   - 发布后回读「制品库上真的出现了这一版」：发布命令退出码为 0 不等于那一版已经在库上。
#     不写回读，一次没落地的发布会以全绿的样子过去，直到有人去页面上核对才发现。
#   非 npm 项目整段删掉。
#
# TODO(5) 非 npm 发布：删掉 TODO(4) 整段，按对应专章的接线段落重写。两条机制任何生态都成立：
#   发布 job 声明短时身份签发权限（只给发布 job，不给检查 job）；发布后回读一次再收工。
# TODO(5a) Python：另有一条——**构建与发布分两个 job**。构建 job 产出 dist 并上传为制品，
#   发布 job 只下载制品再上传，不在发布 job 内构建（同一份产物经两处生成，来源不同就对不上）。
#   正式源只在标签推送时发，测试源每次推送可发。登记与接线见
#   `references/publish-python.md`「可信发布接线步骤」。
# TODO(5b) Rust：先手动发布过一次（操作者为所有者）再去登记；短时身份用官方认证 action 换出
#   短期令牌，经环境变量传给发布命令（不拼进命令行），用完自动吊销。登记与接线见
#   `references/publish-rust.md`「认证」一节。
# TODO(5c) Go：没有上传动作，不需要发布 job——标签即发布，推完触发代理收录即可。

name: release

on:
  push:
    tags: ['v*']  # TODO(1) 改触发行时必须同改下面 job 级的 if: 条件
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 建 Release 要写权限。GITHUB_TOKEN 的初始权限取仓库/组织的默认设置，受限默认下这里会 403；
    # 凭据本身走 secrets.RELEASE_TOKEN，那个令牌已经能建 Release，不依赖 GITHUB_TOKEN。
    permissions:
      contents: write
    # 标签名只在这里求值一次：run 与 with 引用同一个名字，不会算出两个不同的值。
    # 经 env 传入而不是直接展开进脚本正文——展开的话，输入框里的内容会被当成 shell 语法。
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出（全历史；工具取自触发处，说明描述的是 TAG 那个标签）
        uses: actions/checkout@v7  # 落盘前核对最新大版本
        with:
          # 取触发时的 ref 而不是标签：推标签时两者是同一个东西；而 workflow_dispatch
          # 触发时，ref 是你点「运行」的那个分支——**工具用最新的，已经发布的那一页才
          # 有可能被补好**。固定检出标签的话，job 当初失败的原因若在工具里，重跑会
          # 原样再失败一遍，而工具的修复永远补不回已发布的说明。历史取全量，所以按标签
          # 读提交记录照样完整。
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: 建 Release（幂等，已存在则跳过）  # TODO(2)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          else
            <起草命令，把正文写进 notes.md>
            gh release create "$TAG" --notes-file notes.md --title "$TAG" --verify-tag
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

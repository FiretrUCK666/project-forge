# project-forge 发布自动化骨架：打标签即写发布说明，幂等，已存在则跳过。
#
# 用法：复制到目标项目的 .github/workflows/release.yml，按 TODO 逐项替换后删掉本注释块。
# 判据见 references/remote-github.md 第六节与 references/publish.md；机制不要改，只换取值。
#
# 前置（人做，自动化做不了）：仓库 Settings → Secrets → Actions 建 RELEASE_TOKEN——
#   细粒度 token，仅 Contents 读写、仅本仓库、有效期以创建页显示的上限为准；
#   过期或换人只换 Secrets 里那一个值。
#   token 一辈子只出现在两个框里（生成框 → Secrets 输入框），不进仓库、不进聊天。
#
# TODO(1) 标签形状：按生态惯例只留一个——npm 一类 `v*`；Go 模块代理 `v*` 同形；
#   Obsidian 插件必须与 manifest.json 的 version 完全一致（注意带不带 v，见专章）。
# TODO(2) 发布正文：默认从提交记录起草中文说明（提交信息本来就是人话，收集即正文；
#   无上一标签的首版取全量，不交英文白卷）。做法：检出加 fetch-depth: 0，
#   先跑起草脚本写出 UTF-8 文件，再 --notes-file 发送（中文不经 shell）。
#   起草脚本各项目自备一小段（Node 见本 skill 的 draft-release-notes.mjs，
#   纯脚本项目用同原理的 shell 版）；只要 --generate-notes 就仍是英文模板。
#   要手写正文时改用 scripts/release-notes.mjs 路径（UTF-8 文件按字节发送、回读比对）。
# TODO(3) 门禁先行：本文件独立触发，默认不含门禁；要“检查全绿才许发布”时，
#   把 templates/ci-check.yml 的 job 合并进同一文件再加 needs，而不要跨文件 needs。
# 补漏：标签推得比本文件早、或某次失败时，用 workflow_dispatch 手动触发并填标签名——不要重打标签。
#
# 变体（分支驱动附件发布）：有的仓库推主干即发版、附件随包走（如插件模板的成品 tgz）。
#   那是另一套政策，不是本模板改个触发分支就能套用的：版本号来源、附件命名、同版重推
#   是否刷新、CI 与发布是否同文件，都要按该仓库文档重定。本模板只覆盖“标签驱动写发布说明”。
#
# TODO(4) npm 包才需要以下这段（GitHub Release 上面已建好）：可信发布（OIDC）无需长期令牌，
#   但要先带用户在 npm 网站登记发布者身份（组织/仓库/工作流文件名逐字一致，见
#   references/publish-npm.md「可信发布接线步骤」），否则 Publish 步骤报无权失败。
#   非 npm 项目整段删掉。
#
#   permissions:
#     id-token: write   # 签发短时身份用；建 Release 另需 contents: write，二者互不干扰
#   - uses: actions/setup-node@v4   # 与 ci-check.yml 同大版本，分头写会漂移
#     with:
#       node-version: '<清单声明的版本>'
#       registry-url: 'https://registry.npmjs.org'
#       package-manager-cache: false   # 发布构建不用缓存，旧缓存会改变发出去的东西
#   # Node 自带的 npm 可能过旧（可信发布要较新的 npm 大版本）：npm install -g npm@^<大版本>
#   - name: 发布前门禁（与 check  job 同一批命令，不许发布没验过的树）
#     run: |
#       <构建命令>
#       <测试命令>
#   - name: 发布到 npm（tag 与清单版本号不一致直接失败，见模板 TODO(1)）
#     run: npm publish --access public   # 私有包把 public 换成 restricted
#
# TODO(5) 非 npm 发布：删掉 TODO(4) 整段，按对应专章的接线段落重写——Python 见
#   references/publish-python.md「认证」一节（构建与发布分 job），Rust 见
#   references/publish-rust.md「认证」一节，Go 无上传动作不需要发布 job（标签即发布）。

name: release

on:
  push:
    tags: ['v*']  # TODO(1)
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（补漏用），为空则用当前触发的标签'
        required: false
        default: ''

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 检出标签（含全历史，起草要读上一个标签）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: 建 Release（幂等，已存在则跳过）  # TODO(2)
        run: |
          TAG="${{ inputs.tag != '' && inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过。"
          else
            <起草命令，把正文写进 notes.md>
            gh release create "$TAG" --notes-file notes.md --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
